<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assign Quest - VAuLT</title>
        <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .container {
            max-width: 720px;
            margin: 20px auto;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .badge {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0 6px 0;
            font-size: 24px;
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .quest-item {
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            margin-bottom: 16px;
        }

        .quest-item h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #0f172a;
        }

        .quest-item p {
            margin: 0;
            color: #64748b;
            font-size: 13px;
            line-height: 1.4;
        }

        .btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }
        </style>
    </head>
    <body>
        <div class="container">
        <div class="card">
            <span class="badge">Instructor Setup</span>
            <h1>Select a Quest for this Canvas Assignment</h1>
            <p class="subtitle">Assignment: <strong>{{assignmentTitle}}</strong></p>

            <p style="color: #475569; font-size: 15px; margin-bottom: 24px;">
            Choose which VAuLT Quest students should complete when opening this assignment in Canvas:
            </p>

            <div class="quest-list">
            {{questListHtml}}
            </div>
        </div>
        </div>
    </body>
</html>
